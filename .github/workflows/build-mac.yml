name: Build macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Download PHP for macOS
        run: |
          curl -L "https://dl.static-php.dev/static-php-cli/common/php-8.3-cli-macos-x86_64.tar.gz" -o php-static.tar.gz
          mkdir -p php-bin
          tar -xzf php-static.tar.gz -C php-bin
          mv php-bin/php-8.3 php-bin/php 2>/dev/null || true
          chmod +x php-bin/php
          printf "extension=pdo_sqlite\nextension=sqlite3\nextension=pdo\nextension=mbstring\nextension=json\n" > php-bin/php.ini

      - name: Build macOS DMG
        run: npx electron-builder --mac --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: veresiyem-mac
          path: build/**/*.dmg
