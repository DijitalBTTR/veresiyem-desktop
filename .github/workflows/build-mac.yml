name: Build macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Download PHP for macOS
        run: |
          brew install php
          mkdir -p php-bin
          cp $(which php) php-bin/php
          chmod +x php-bin/php
          # php.ini oluştur - SQLite ve gerekli uzantılar
          cat > php-bin/php.ini << 'EOF'
          extension=pdo_sqlite
          extension=sqlite3
          extension=pdo
          extension=mbstring
          extension=json
          EOF

      - name: Build macOS DMG
        run: npx electron-builder --mac --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: veresiyem-mac
          path: build/**/*.dmg
